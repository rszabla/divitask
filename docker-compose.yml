version: '3.8'

services:
  divitask:
    build:
      context: .
      dockerfile: Dockerfile
    image: divitask:latest
    container_name: divitask
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ${DATA_PATH:-/docker/divitask/data}:/app/data
